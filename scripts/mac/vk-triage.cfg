# Vulkan validation-layer triage rules.
# Format: severity | VUID-glob | note (note is optional, free-form)
#
# Matching rule: FIRST RULE WHOSE GLOB MATCHES WINS. The awk script in
# vk-validation-group.sh walks rules top-to-bottom and stops at the first hit.
# Implication: put MOST SPECIFIC patterns ABOVE more general ones. A line
# `high | VUID-* | catch-all` placed at the top would shadow every later rule.
#
# Severities:
#   fatal    -> blocks rendering; fix before anything else
#   high     -> wrong-but-renders; visible artefacts
#   medium   -> conformance gap; usually safe on MoltenVK
#   low      -> informational; multi-GPU, validation-perf etc.
#   ignore   -> known-benign-on-this-project; suppressed from triage rollup
#
# Globs: '*' matches any chars, '.' is literal.
# Add new rows as the project's Vulkan footprint matures.

# ---- FATAL: cannot render at all ----------------------------------------
fatal  | VUID-vkQueueSubmit-*                       | submission failed
fatal  | VUID-vkQueuePresentKHR-*                   | swapchain present failed
fatal  | VUID-*-renderPass-*                        | render-pass topology mismatch
fatal  | VUID-*-pNext-pNext                         | invalid pNext chain (struct version)
fatal  | VUID-VkSubmitInfo-pCommandBuffers-*        | command-buffer state at submit
fatal  | VUID-vkCmdBeginRenderPass-*                | renderpass-begin invariants

# ---- HIGH: visible artefacts ---------------------------------------------
high   | VUID-*-DescriptorSet-*                     | wrong shader bindings
high   | VUID-VkWriteDescriptorSet-*                | descriptor-write mismatch
high   | VUID-vkCmdDraw-*                           | per-draw state issues
high   | VUID-*-VkPipelineLayout-*                  | pipeline-layout shape
high   | VUID-*-VkGraphicsPipelineCreateInfo-*      | pipeline-create state

# ---- MEDIUM: usually safe on MoltenVK ------------------------------------
medium | VUID-*-ImageLayout-*                       | layout transitions
medium | VUID-VkImageMemoryBarrier-*                | barriers (MVK lenient here)
medium | VUID-vkCmdPipelineBarrier-*                | barrier ordering

# ---- LOW: informational --------------------------------------------------
low    | VUID-*-deviceMask-*                        | multi-GPU, irrelevant on single GPU
low    | VUID-*-bestPractices-*                     | best-practices layer
low    | UNASSIGNED-BestPractices-*                 | best-practices layer

# ---- IGNORE: known benign on Quake3e renderervk --------------------------
ignore | UNASSIGNED-CoreValidation-Shader-OutputNotConsumed | Q3 shaders intentionally over-declare
ignore | UNASSIGNED-CoreValidation-Shader-InputNotProduced  | Q3 shaders' optional inputs
